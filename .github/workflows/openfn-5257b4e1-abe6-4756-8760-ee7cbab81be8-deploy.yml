on:
  push:
    branches:
      - test
    # Only deploy when this project's workspace (or this file) changes
    paths:
      - '**'
      - '.github/workflows/openfn-5257b4e1-abe6-4756-8760-ee7cbab81be8-deploy.yml'
  workflow_dispatch:
    inputs:
      force:
        description:
          'Deploy even if the project has changed in OpenFn since the last sync'
        type: boolean
        default: false

# Shared with openfn-pull.yml so a pull and a deploy never push to the same
# branch at once
concurrency:
  group: openfn-test
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: Deploy project to OpenFn
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: openfn/cli-deploy-action@v2
        with:
          secret_input: ${{ secrets.OPENFN_5257b4e1_abe6_4756_8760_ee7cbab81be8_API_KEY }}
          project_id_input: '5257b4e1-abe6-4756-8760-ee7cbab81be8'
          endpoint_input: 'https://app.staging.openfn.org'
          workspace_input: '.'
          # A commit with [openfn force] in its message forces the deploy too
          force_input:
            ${{ inputs.force || contains(github.event.head_commit.message,
            '[openfn force]') }}
