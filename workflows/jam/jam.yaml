id: jam
name: jam
start: webhook
steps:
  - id: untitled-step
    name: Untitled step
    adaptor: '@openfn/language-common@latest'
    expression: ./untitled-step.js
  - id: webhook
    type: webhook
    webhook_reply: after_completion
    next:
      untitled-step:
        disabled: false
        condition: always
