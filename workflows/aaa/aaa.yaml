id: aaa
name: AAA
start: webhook
steps:
  - id: transform-data
    name: Transform data
    adaptor: '@openfn/language-common@latest'
    expression: ./transform-data.js
  - id: webhook
    type: webhook
    enabled: false
    webhook_reply: after_completion
    next:
      transform-data:
        disabled: false
        condition: always
